name: 文档一致性检查

# 触发条件：main 分支推送、Pull Request、手动触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支仅保留最新一次构建：快速连续提交时自动取消旧构建，
# 避免多个多架构（QEMU）构建并发堆积、互相拖慢导致镜像迟迟不更新。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# 任务集
jobs:
  docs-check:
    name: 文档检查
    # 选择虚拟环境
    runs-on: ubuntu-latest

    # 权限
    permissions:
      actions: write
      contents: read

    # 运行步骤
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 执行文档一致性检查
        run: ./scripts/check_all.sh

      - name: 删除旧的GitHub-workflow
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3    #保留多少个workflow不删除
